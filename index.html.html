<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de Desconto</title>
    <link rel="stylesheet" href="style.css.css">
</head>
<body>

    <h2>Calculadora de Desconto</h2>

    <label for="valorCompra">Valor da compra:</label>
    <input type="number" id="valorCompra" placeholder="Digite o valor">
    <button onclick="calcularDesconto()">Calcular</button>

    <div id="resultado">
        <p>Valor da compra: <span id="resCompra">R$ 0,00</span></p>
        <p>Valor do desconto: <span id="resDesconto">R$ 0,00</span></p>
        <p>Valor da compra com desconto: <span id="resFinal">R$ 0,00</span></p>
    </div>

    <script src="main.js"></script>
</body>
</html>
